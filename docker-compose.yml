services:
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  session-service:
    build:
      context: .
    environment:
      SESSION_HOST: ${SESSION_HOST:-0.0.0.0}
      SESSION_PORT: ${SESSION_PORT:-8081}
      SESSION_API_KEY: ${SESSION_API_KEY:-change-me}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${SESSION_PORT:-8081}:${SESSION_PORT:-8081}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${SESSION_PORT:-8081}/health | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  redis_data:
